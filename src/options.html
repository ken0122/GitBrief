<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GitBrief 设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="settings">
      <header>
        <h1>GitBrief 设置</h1>
        <p>配置 GitBrief 使用的 Chat Completions 兼容模型接口。API Key 会保存在本机 Chrome 扩展存储中。</p>
      </header>

      <form id="settings-form">
        <label>
          <span>Base URL</span>
          <input id="base-url" name="baseUrl" type="url" placeholder="https://api.openai.com/v1" autocomplete="off" required>
        </label>

        <label>
          <span>模型 ID</span>
          <input id="model" name="model" type="text" placeholder="例如：gpt-4o-mini 或你的服务商模型名" autocomplete="off" required>
        </label>

        <label>
          <span>API Key</span>
          <input id="api-key" name="apiKey" type="password" placeholder="sk-..." autocomplete="off" required>
        </label>

        <label>
          <span>Temperature</span>
          <input id="temperature" name="temperature" type="number" min="0" max="2" step="0.1" value="0.2">
        </label>

        <div class="actions">
          <button type="submit">保存设置</button>
          <button type="button" id="clear-button">清空</button>
        </div>

        <p id="status" role="status"></p>
      </form>
    </main>

    <script src="options.js"></script>
  </body>
</html>
