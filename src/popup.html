<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GitHub Repo Summarizer</title>
    <style>
      body {
        font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-width: 240px;
        padding: 14px;
      }

      h1 {
        font-size: 15px;
        margin: 0 0 8px;
      }

      p {
        color: #57606a;
        line-height: 1.45;
        margin: 0 0 12px;
      }

      button {
        border: 1px solid #d0d7de;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        padding: 7px 10px;
      }
    </style>
  </head>
  <body>
    <h1>GitHub Repo Summarizer</h1>
    <p>打开 GitHub 仓库页后，在右侧卡片点击“总结此仓库”。</p>
    <button id="open-options" type="button">打开设置</button>
    <script src="popup.js"></script>
  </body>
</html>
