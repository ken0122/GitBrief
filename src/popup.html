<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GitBrief</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: var(--bgColor-default, #ffffff);
        color: var(--fgColor-default, #1f2328);
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-width: 280px;
        padding: 16px;
      }

      h1 {
        color: var(--fgColor-default, #1f2328);
        font-size: 16px;
        font-weight: 600;
        line-height: 1.25;
        margin: 0 0 6px;
      }

      p {
        color: var(--fgColor-muted, #656d76);
        font-size: 13px;
        line-height: 1.45;
        margin: 0 0 14px;
      }

      button {
        appearance: none;
        background: var(--button-default-bgColor-rest, #f6f8fa);
        border: 1px solid var(--button-default-borderColor-rest, #d0d7de);
        border-radius: 6px;
        color: var(--button-default-fgColor-rest, #24292f);
        cursor: pointer;
        font: 600 13px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        min-height: 32px;
        padding: 5px 12px;
      }

      button:hover {
        background: var(--button-default-bgColor-hover, #f3f4f6);
        border-color: var(--button-default-borderColor-hover, #d0d7de);
      }

      button:active {
        background: var(--button-default-bgColor-active, #ebecf0);
      }

      button:focus-visible {
        outline: 2px solid var(--focus-outlineColor, #0969da);
        outline-offset: 2px;
      }

      .popup {
        display: grid;
        gap: 0;
      }

      .popup__action {
        justify-self: start;
      }

      .popup__title {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main class="popup">
      <h1 class="popup__title">GitBrief</h1>
      <p>打开 GitHub 仓库页后，在右侧 GitBrief 卡片点击“总结此仓库”。</p>
      <button class="popup__action" id="open-options" type="button">打开设置</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
